[project]
name = "mecha-mother"
version = "0.1.0"
description = "Monolithic Computational Substrate framework - unified theory of physics, consciousness, ethics, and aesthetics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mecha_mother"]

[tool.mypy]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
