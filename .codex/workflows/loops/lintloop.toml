[LINTLOOP]
description = "Run lint/test/type checks via uv and loop agent-based code correction until clean."
max_loops = 10

[STEP1]
run = [
    "uv sync --group dev",
    "uv run pytest",
    "uv run black --check src tests",
    "uv run ruff check src tests",
    "uv run mypy src",
]

[STEP2]
tool = ["code_correction"]
instructions = [
    "Fix failing checks from STEP1/STEP3 outputs.",
    "Prefer ruff auto-fix first: uv run ruff check src tests --fix --unsafe-fixes",
    "Then format: uv run black src tests",
    "Apply targeted manual fixes for remaining mypy/ruff/test failures.",
]

[STEP3]
run = [
    "uv run pytest",
    "uv run black --check src tests",
    "uv run ruff check src tests",
    "uv run mypy src",
]

[STEP4]
error_condition = [
    "true: any non-zero exit code in [STEP3]",
    "false: all commands in [STEP3] return zero",
]
if_true = ["+LOOP:[STEP2]"]
if_false = ["-LOOP:complete"]
